                        <div className="w-16 h-16 rounded-full bg-slate-200 border border-slate-300 flex items-center justify-center shrink-0">
                          <svg
                            xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 80 80"
                            className="w-10 h-10 text-slate-400"
                            fill="none"
                          >
                            <circle cx="40" cy="40" r="40" fill="#e2e8f0" />
                            <circle cx="40" cy="30" r="13" fill="#94a3b8" />
                            <ellipse cx="40" cy="68" rx="22" ry="14" fill="#94a3b8" />
                          </svg>
                        </div>
                        <div>
                          <h3 className="font-bold text-slate-900 text-sm leading-snug">
                            {persona.nombre}
                          </h3>
                          <span className="text-xs font-semibold text-blue-900 block mt-0.5">
                            {persona.cargo}
                          </span>
                          <span className="text-[11px] text-slate-500 block">
                            {persona.especialidad}
                          </span>
                        </div>
                      </div>

                      <div className="space-y-1.5 text-xs text-slate-600 border-t border-slate-100 pt-3">
                        <div className="flex justify-between">
                          <span className="text-slate-400">Matrícula MPPS:</span>
                          <span className="font-mono font-medium text-slate-800">{persona.mpps}</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-slate-400">Colegiatura:</span>
                          <span className="font-medium text-slate-700">{persona.colegio}</span>
                        </div>
                        <p className="text-slate-500 text-[11px] pt-1 leading-relaxed">
                          {persona.descripcion}
                        </p>
                      </div>
                    </div>

                    <div className="bg-slate-50 px-5 py-3 border-t border-slate-100 flex justify-between items-center text-xs">
                      <span className="text-slate-500 font-mono text-[11px]">{persona.cedula}</span>
                      <a href={`tel:${persona.telefono}`} className="font-medium text-blue-950 hover:underline">
                        <Icons.Phone />
                        {persona.telefono}
                      </a>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* SECCIÓN 3: SOLICITUD DE TURNO LIMPIA */}
          <section id="citas" className="py-16 px-4 sm:px-6 lg:px-8 max-w-4xl mx-auto w-full">
            <div className="bg-white rounded-2xl border border-slate-200 p-6 sm:p-10 shadow-sm">
              <div className="text-center max-w-xl mx-auto mb-8">
                <span className="text-blue-900 font-semibold text-xs uppercase tracking-wider">
                  Atención al Usuario
                </span>
                <h3 className="text-xl font-bold text-slate-900 mt-1">
                  Solicitud de Turno o Consulta Médica
                </h3>
                <p className="text-slate-500 text-xs mt-1.5">
                  Complete los datos requeridos. Secretaría confirmará la disponibilidad de su consulta o estudio.
                </p>
              </div>

              {citaConfirmada ? (
                <div className="bg-blue-50 border border-blue-200 rounded-xl p-6 text-center space-y-3">
                  <div className="w-10 h-10 bg-blue-900 text-white rounded-full flex items-center justify-center mx-auto text-lg font-bold">
                    ✓
                  </div>
                  <h4 className="text-base font-bold text-slate-900">Solicitud Recibida</h4>
                  <p className="text-xs text-slate-600">
                    Código de turno: <strong className="font-mono text-blue-950">{citaConfirmada.codigo}</strong>
                  </p>
                  <p className="text-xs text-slate-500">
                    Paciente: {citaConfirmada.nombre} ({citaConfirmada.cedula}) • {citaConfirmada.servicioRequerido}
                  </p>
                  <button
                    onClick={() => setCitaConfirmada(null)}
                    className="text-xs bg-blue-900 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-800 transition"
                  >
                    Nueva Solicitud
                  </button>
                </div>
              ) : (
                <form onSubmit={handleEnviarCita} className="space-y-4 text-xs">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Nombre Completo *</label>
                      <input
                        type="text"
                        required
                        placeholder="Nombres y Apellidos"
                        value={citaForm.nombre}
                        onChange={(e) => setCitaForm({...citaForm, nombre: e.target.value})}
                        className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-900"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Cédula de Identidad *</label>
                      <input
                        type="text"
                        required
                        placeholder="V-XX.XXX.XXX"
                        value={citaForm.cedula}
                        onChange={(e) => setCitaForm({...citaForm, cedula: e.target.value})}
                        className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-900 uppercase font-mono"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Teléfono de Contacto *</label>
                      <input
                        type="tel"
                        required
                        placeholder="0414-XXXXXXX"
                        value={citaForm.telefono}
                        onChange={(e) => setCitaForm({...citaForm, telefono: e.target.value})}
                        className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-900"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Área o Servicio Requerido *</label>
                      <select
                        value={citaForm.servicioRequerido}
                        onChange={(e) => setCitaForm({...citaForm, servicioRequerido: e.target.value})}
                        className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-900 font-medium"
                      >
                        <option value="Área de Emergencia y Triaje">Área de Emergencia y Triaje</option>
                        <option value="Servicio de Radiología (Rayos X)">Servicio de Radiología (Rayos X)</option>
                        <option value="Quirófano / Cirugía Ambulatoria">Quirófano / Cirugía Ambulatoria</option>
                        <option value="Medicina General y Consulta">Consulta de Medicina General</option>
                        <option value="Enfermería y Curaciones">Enfermería y Curaciones</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Fecha Deseada *</label>
                    <input
                      type="date"
                      required
                      value={citaForm.fechaDeseada}
                      onChange={(e) => setCitaForm({...citaForm, fechaDeseada: e.target.value})}
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-900 font-medium"
                    />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Motivo o Breve Descripción</label>
                    <textarea
                      rows="2"
                      placeholder="Indique brevemente el motivo de su consulta o estudio..."
                      value={citaForm.motivo}
                      onChange={(e) => setCitaForm({...citaForm, motivo: e.target.value})}
                      className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-900"
                    ></textarea>
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-blue-950 hover:bg-blue-900 text-white font-semibold py-2.5 rounded-lg transition text-xs tracking-wider uppercase shadow-xs"
                  >
                    Enviar Solicitud
                  </button>
                </form>
              )}
            </div>
          </section>

          {/* Footer Formal */}
          <footer className="bg-white border-t border-slate-200 py-10 px-4 sm:px-6 lg:px-8 text-xs text-slate-500">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
              <div>
                <p className="font-bold text-slate-900">CLÍNICA SAN JORGE C.A. • RIF: J-40812903-1</p>
                <p className="text-[11px] text-slate-400 mt-0.5">Avenida Principal de Temblador, Municipio Libertador, Estado Monagas, Venezuela.</p>
              </div>
              <div className="text-right">
                <p>© 2026 Clínica San Jorge C.A. Todos los derechos reservados.</p>
                <p className="text-[11px] text-slate-400">Proyecto Socio-Tecnológico UTDFT • PNF en Informática</p>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<PortalPublico />);
  </script>
</body>
</html>
